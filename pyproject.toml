[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-downloader"
version = "0.1.0"
description = "Descargador universal de video/audio (yt-dlp + FFmpeg) con CLI interactiva"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "JOSE COLOMBIO GONZALEZ PEREZ" }]
keywords = ["yt-dlp", "downloader", "ffmpeg", "cli", "termux"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "yt-dlp>=2024.1.1",
    "ffmpeg-python>=0.2.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "mutagen>=1.47.0",
    "platformdirs>=4.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/pepe1603/universal-media-downloader"

[project.scripts]
umd = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: las líneas largas son mayormente markup de Rich en mensajes de usuario
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# main.py modifica sys.path antes de importar (ejecución directa con python src/main.py)
"src/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/core"]

[tool.coverage.report]
fail_under = 60
